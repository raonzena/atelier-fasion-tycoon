<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18332e">
  <title>ATELIER — 의류 회사 타이쿤</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318332e'/%3E%3Cpath d='M12 48 32 12l20 36M20 37h24' fill='none' stroke='%23f7d37c' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="game-shell">
  <header class="hud">
    <div class="brand"><span class="brand-mark">A</span><div><strong>ATELIER</strong><small>FASHION COMPANY TYCOON</small></div></div>
    <div class="hud-stats" aria-label="회사 현황">
      <div class="hud-stat"><span>회사 레벨</span><strong id="companyLevel">1</strong></div>
      <div class="hud-stat"><span>자산</span><strong id="assetValue">₩120M</strong></div>
      <div class="hud-stat"><span>고객</span><strong id="customerValue">320명</strong></div>
    </div>
    <button class="save-button" id="saveButton" type="button">저장 안내</button>
  </header>
  <div class="guest-banner" id="guestBanner">게스트 플레이 중 · 화면을 나가면 진행 내용이 사라집니다. <button type="button" id="saveInfo">저장 방식 보기</button></div>
  <main class="play-area">
    <div class="scene" id="scene" aria-label="배치 가능한 회사 사무실">
      <div class="room-backdrop" id="roomBackdrop"></div>
      <div class="room-vignette"></div>
      <div class="scene-label"><span class="eyebrow">MY ATELIER · YEAR <span id="year">1</span></span><strong id="officeTitle">낡은 원룸 사무실</strong><span id="officeLevel">오피스 LV. 1 / 10</span></div>
      <div class="season-card"><span>이번 시즌</span><strong id="season">봄</strong><small id="trend">트렌드 · 미니멀 셔츠</small></div>
      <div class="floor" id="floor" role="grid" aria-label="사무실 배치 칸"></div>
      <div class="placement-hint" id="placementHint" aria-live="polite">가구와 직원을 터치해 살펴보세요</div>
    </div>
    <div class="bottom-dock">
      <div class="dock-summary"><span class="eyebrow">OFFICE PROGRESS</span><strong id="progressTitle">작은 시작, 첫 번째 컬렉션</strong><span id="progressText">컬렉션을 출시해 다음 오피스를 열어보세요.</span></div>
      <div class="dock-actions">
        <button class="dock-button edit-button" id="editButton" type="button"><span class="button-icon">▦</span><span>배치 수정</span></button>
        <button class="dock-button upgrade-button" id="upgradeButton" type="button"><span class="button-icon">⌂</span><span id="upgradeLabel">오피스 확장</span><small id="upgradeCost">₩95M · 출시 1회 필요</small></button>
        <button class="dock-button" id="researchButton" type="button"><span class="button-icon">✎</span><span>팀·연구</span></button>
        <button class="dock-button primary-button" id="launchButton" type="button"><span class="button-icon">✦</span><span>새 컬렉션</span></button>
      </div>
    </div>
  </main>
  <section class="inventory" id="inventory" hidden aria-label="배치할 가구와 직원">
    <div class="inventory-heading"><div><strong>사무실 배치</strong><span>가구 또는 직원을 선택한 뒤 바닥을 터치하세요. 배치한 물건을 끌어서 옮길 수도 있어요.</span></div><button id="doneButton" type="button">완료</button></div>
    <div class="inventory-items" id="inventoryItems"></div>
  </section>
</div>
<div class="modal-layer" id="modalLayer" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="닫기" type="button">×</button><div id="modalContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./game.js" defer></script>
</body></html>
